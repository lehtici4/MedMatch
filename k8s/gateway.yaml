# ─────────────────────────────────────────────────────────────────
# API GATEWAY — MedMatch
# Único ponto de acesso externo (NodePort 30080)
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: medmatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: SEU_DOCKER_USER/medmatch-gateway:latest
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8000"
            - name: RECOVERY_SERVICE_URL
              value: "http://recovery-service:8000"
            - name: DOCTORS_SERVICE_URL
              value: "http://doctors-service:8000"
            - name: SCHEDULING_SERVICE_URL
              value: "http://schedule-service:8000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medmatch-jwt-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: medmatch
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
  type: NodePort