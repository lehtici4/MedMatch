# ─────────────────────────────────────────────────────────────────
# DATABASES — MedMatch
# MySQL com PVC + init SQL via ConfigMap
# ─────────────────────────────────────────────────────────────────

# ── PVCs ──────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: credentials-db-pvc
  namespace: medmatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doctors-db-pvc
  namespace: medmatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduling-db-pvc
  namespace: medmatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ── Credentials DB ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credentials-db
  namespace: medmatch
  labels:
    app: credentials-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credentials-db
  template:
    metadata:
      labels:
        app: credentials-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: medmatch-credentials-db-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: medmatch-credentials-db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medmatch-credentials-db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medmatch-credentials-db-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: credentials-db-data
              mountPath: /var/lib/mysql
            - name: credentials-db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: credentials-db-data
          persistentVolumeClaim:
            claimName: credentials-db-pvc
        - name: credentials-db-init
          configMap:
            name: credentials-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: credentials-db
  namespace: medmatch
spec:
  selector:
    app: credentials-db
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

