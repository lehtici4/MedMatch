# ─────────────────────────────────────────────────────────────────
# MICROSSERVIÇOS — MedMatch
# Todos com securityContext (Pod Security) e Secrets injetados
# ─────────────────────────────────────────────────────────────────

# ── Auth Service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: medmatch
  labels:
    app: medmatch
    component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: auth-service
          image: SEU_DOCKER_USER/medmatch-auth:latest
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medmatch-db-secret
                  key: MYSQL_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: medmatch-db-secret
                  key: MYSQL_USER
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medmatch-jwt-secret
                  key: JWT_SECRET_KEY
            - name: DB_HOST
              value: "mysql"
            - name: DB_NAME
              value: "medmatch_db"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medmatch
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

